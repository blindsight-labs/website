<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-06PKBPMVBJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-06PKBPMVBJ');
  </script>

  <title>End-User Licence Agreement | Blindsight</title>
  <meta name="description" content="The Blindsight desktop end-user licence agreement." />
  <link rel="canonical" href="https://www.blindsight.io/legal/eula" />

  <!-- Favicon -->
  <link rel="icon" href="../../assets/images/Emblem_B.png" type="image/png" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Set theme before paint to avoid flash -->
  <script>
    document.documentElement.setAttribute('data-theme',
      window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    );
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
      --display: 'Space Grotesk', sans-serif;
      --purple: #6D28D9;
      --transition-theme: background 0.45s ease, color 0.45s ease, border-color 0.45s ease;
    }

    [data-theme="dark"] {
      --bg: #020202;
      --text: #F8F8F8;
      --text-mid: #C5C5C5;
      --text-dim: #545454;
      --text-body: rgba(255,255,255,0.55);
      --text-intro: rgba(255,255,255,0.7);
      --text-heading-sub: rgba(255,255,255,0.9);
      --text-strong: rgba(255,255,255,0.8);
      --text-updated: rgba(255,255,255,0.3);
      --nav-bg: rgba(2,2,2,0.7);
      --nav-link: rgba(255,255,255,0.35);
      --nav-tagline: rgba(255,255,255,0.3);
      --border: rgba(255,255,255,0.05);
      --divider: rgba(255,255,255,0.06);
      --mobile-bg: rgba(2,2,2,0.96);
      --mobile-link: rgba(255,255,255,0.7);
      --hamburger: #F8F8F8;
    }

    [data-theme="light"] {
      --bg: #F2F2EF;
      --text: #020202;
      --text-mid: #3a3a3a;
      --text-dim: #888;
      --text-body: rgba(0,0,0,0.55);
      --text-intro: rgba(0,0,0,0.6);
      --text-heading-sub: rgba(0,0,0,0.8);
      --text-strong: rgba(0,0,0,0.7);
      --text-updated: rgba(0,0,0,0.3);
      --nav-bg: rgba(242,242,239,0.92);
      --nav-link: rgba(0,0,0,0.35);
      --nav-tagline: rgba(0,0,0,0.3);
      --border: rgba(0,0,0,0.08);
      --divider: rgba(0,0,0,0.08);
      --mobile-bg: rgba(242,242,239,0.96);
      --mobile-link: rgba(0,0,0,0.6);
      --hamburger: #020202;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15.4px;
      min-height: 100vh;
      overflow-x: hidden;
      transition: var(--transition-theme);
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 56px;
      background: var(--nav-bg); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: var(--transition-theme);
    }
    .nav-wordmark {
      font-family: var(--display); font-size: 18px; font-weight: 700;
      color: var(--text); text-decoration: none; letter-spacing: -0.02em;
      display: flex; align-items: center;
      transition: color 0.45s ease;
    }
    .nav-logo { height: 22px; width: auto; display: block; }
    .nav-logo-dark { display: block; }
    .nav-logo-light { display: none; }
    [data-theme="light"] .nav-logo-dark { display: none; }
    [data-theme="light"] .nav-logo-light { display: block; }
    .nav-tagline {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--nav-tagline);
      margin-left: 12px; transition: color 0.45s ease;
    }
    .nav-links { display: flex; align-items: center; gap: 36px; list-style: none; }
    .nav-links a {
      font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--nav-link);
      text-decoration: none; transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--text); }

    /* Hamburger */
    .hamburger {
      display: none; background: none; border: none; cursor: pointer;
      width: 28px; height: 20px; position: relative; z-index: 210;
      flex-direction: column; justify-content: space-between;
    }
    .hamburger span {
      display: block; width: 100%; height: 2px; background: var(--hamburger);
      transition: transform 0.3s ease, opacity 0.3s ease, background 0.45s ease;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

    .mobile-menu {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--mobile-bg); backdrop-filter: blur(20px);
      z-index: 199;
      flex-direction: column; align-items: center; justify-content: center; gap: 32px;
      transition: background 0.45s ease;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-family: var(--mono); font-size: 14px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--mobile-link);
      text-decoration: none; transition: color 0.3s;
    }
    .mobile-menu a:hover { color: var(--text); }

    /* ── CONTENT ── */
    .pp-container {
      max-width: 780px;
      margin: 0 auto;
      padding: 140px 56px 80px;
    }

    .pp-tag {
      font-family: var(--mono); font-size: 9.5px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--purple); margin-bottom: 20px;
    }

    .pp-title {
      font-family: var(--display); font-size: clamp(32px, 5vw, 48px);
      font-weight: 700; letter-spacing: -0.03em;
      line-height: 1.15; margin-bottom: 12px;
      color: var(--text); transition: color 0.45s ease;
    }

    .pp-updated {
      font-family: var(--mono); font-size: 11px;
      color: var(--text-updated); letter-spacing: 0.06em;
      margin-bottom: 48px; transition: color 0.45s ease;
    }

    .pp-intro {
      font-size: 15.4px; line-height: 1.75;
      color: var(--text-intro); margin-bottom: 48px;
      transition: color 0.45s ease;
    }

    .pp-section { margin-bottom: 40px; }

    .pp-section h2 {
      font-family: var(--display); font-size: 20px;
      font-weight: 700; letter-spacing: -0.02em;
      margin-bottom: 16px; color: var(--text);
      transition: color 0.45s ease;
    }

    .pp-section h3 {
      font-family: var(--display); font-size: 16px;
      font-weight: 700; letter-spacing: -0.01em;
      margin-bottom: 10px; color: var(--text-heading-sub);
      transition: color 0.45s ease;
    }

    .pp-section p {
      font-size: 14px; line-height: 1.8;
      color: var(--text-body); margin-bottom: 14px;
      transition: color 0.45s ease;
    }

    .pp-section ul { list-style: none; margin-bottom: 16px; padding: 0; }

    .pp-section ul li {
      font-size: 14px; line-height: 1.8;
      color: var(--text-body);
      padding-left: 20px; position: relative;
      margin-bottom: 10px; transition: color 0.45s ease;
    }

    .pp-section ul li::before {
      content: '';
      position: absolute; left: 0; top: 10px;
      width: 6px; height: 6px;
      border: 1px solid var(--purple);
      border-radius: 1px;
    }

    .pp-section strong {
      color: var(--text-strong); font-weight: 600;
      transition: color 0.45s ease;
    }

    .pp-divider {
      height: 1px;
      background: var(--divider);
      margin: 48px 0;
      transition: background 0.45s ease;
    }

    .pp-section a {
      color: var(--purple); text-decoration: none;
      border-bottom: 1px solid rgba(109,40,217,0.3);
      transition: border-color 0.2s;
    }
    .pp-section a:hover { border-color: var(--purple); }

    /* ── FOOTER ── */
    footer {
      padding: 32px 56px; background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      position: relative; z-index: 1;
      transition: var(--transition-theme);
    }
    .footer-brand {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.1em; color: var(--text-dim);
      transition: color 0.45s ease;
    }
    .footer-brand strong { color: var(--text-mid); transition: color 0.45s ease; }
    .footer-links { display: flex; gap: 28px; list-style: none; }
    .footer-links a {
      font-family: var(--mono); font-size: 9.5px;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-dim); text-decoration: none; transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--text-mid); }

    /* ── RESPONSIVE ── */
    @media (min-width: 1400px) {
      nav, footer {
        padding-left: calc((100vw - 1280px) / 2);
        padding-right: calc((100vw - 1280px) / 2);
      }
    }
    @media (max-width: 1100px) {
      nav { padding: 18px 28px; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .pp-container { padding-left: 28px; padding-right: 28px; }
    }
    @media (max-width: 640px) {
      nav { padding: 14px 16px; }
      .nav-logo { height: 18px; }
      .nav-tagline { display: none; }
      .pp-container { padding: 100px 16px 56px; }
      footer { padding: 24px 16px; flex-direction: column; gap: 16px; text-align: center; }
      .footer-links { flex-wrap: wrap; justify-content: center; gap: 16px; }
    }
  </style>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="blindsight-licence-status" content="draft" />
</head>
<body>

<!-- NAV -->
<nav>
  <div style="display:flex;align-items:center;">
    <a href="/" class="nav-wordmark">
      <img src="../../assets/images/LOGO_Primary_W.png" alt="Blindsight" class="nav-logo nav-logo-dark" />
      <img src="../../assets/images/LOGO_Primary_B.png" alt="Blindsight" class="nav-logo nav-logo-light" />
    </a>
  </div>
  <ul class="nav-links">
    <li><a href="/antidote/">Antidote</a></li>
    <li><a href="mailto:info@blindsight.io">Contact</a></li>
  </ul>
  <button class="hamburger" id="hamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="mobile-menu" id="mobile-menu">
  <a href="/antidote/">Antidote</a>
  <a href="mailto:info@blindsight.io">Contact</a>
</div>

<!-- CONTENT -->
<div class="pp-container">
  <div class="pp-tag">// Legal</div>
  <h1 class="pp-title">End-User Licence Agreement</h1>
  <p class="pp-intro">This agreement is being finalised and is not published yet.</p>
</div>

<!-- FOOTER -->
<footer>
  <span class="footer-brand"><strong>Blindsight Technologies AG</strong> · Securing AI · 2026</span>
  <ul class="footer-links">
    <li><a href="/antidote/">Antidote</a></li>
    <li><a href="/privacy-policy/">Privacy</a></li>
    <li><a href="/legal/eula/">Licence</a></li>
    <li><a href="mailto:info@blindsight.io">Contact</a></li>
  </ul>
</footer>

<script>
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobile-menu');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
  });

  // Live OS preference listener
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
    document.documentElement.setAttribute('data-theme', e.matches ? 'light' : 'dark');
  });
</script>
</body>
</html>
